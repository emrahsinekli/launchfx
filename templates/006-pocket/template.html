<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>006 Pocket</title>
<style>
@font-face{font-family:Disp;src:url(/fonts/display.woff2);font-weight:200 800}
@font-face{font-family:Sans;src:url(/fonts/sans.woff2);font-weight:100 900}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#222}
#stage{position:absolute;inset:0;overflow:hidden;font-family:Sans;color:#fff;--h1:285;--h2:335;--h3:225;
  --c1:oklch(.6 .23 var(--h1));--c2:oklch(.68 .21 var(--h2));--c3:oklch(.78 .15 var(--h3));--ink:#14121c;--ac:oklch(.6 .23 var(--h1))}
#bg{position:absolute;inset:-10%;background:linear-gradient(135deg,var(--c1),var(--c2))}
.blob{position:absolute;border-radius:50%;filter:blur(120px)}
.shape{position:absolute;left:0;top:0}
#world{position:absolute;inset:0}
.scene{position:absolute;inset:0;display:none}
#wipe{position:absolute;inset:0;display:none}
#fade{position:absolute;inset:0;background:#000;opacity:0}
.t{font-family:Disp;font-weight:800;letter-spacing:-.045em;line-height:1;text-shadow:0 10px 40px rgba(20,10,60,.25)}
.w{display:inline-block;white-space:pre;transform-origin:50% 100%}

/* phone */
.ph{position:absolute;width:400px;height:820px;margin:-410px 0 0 -200px;border-radius:66px;background:#0d0c12;padding:12px;box-shadow:0 70px 120px -30px rgba(20,8,60,.6),0 0 0 2px rgba(255,255,255,.25),inset 0 0 0 2px #2a2833}
.scr{position:relative;width:100%;height:100%;border-radius:54px;background:#fbfbfd;overflow:hidden;color:var(--ink);padding:60px 26px 26px}
.scr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.notch{position:absolute;left:50%;top:14px;width:110px;height:30px;margin-left:-55px;border-radius:99px;background:#0d0c12;z-index:2}
.sh{font-family:Disp;font-weight:800;font-size:34px;letter-spacing:-.03em}
.ss{font-size:17px;color:#7a7888;margin-top:2px}
.ringw{position:relative;width:250px;height:250px;margin:34px auto 0}
.ringw svg{width:100%;height:100%}
.ringw b{position:absolute;inset:0;display:grid;place-items:center;font-family:Disp;font-size:76px;font-weight:800;letter-spacing:-.04em}
.pillrow{height:74px;border-radius:20px;background:#f0eff5;margin-top:14px;display:flex;align-items:center;gap:14px;padding:0 18px;font-size:20px;font-weight:600}
.pillrow i{width:30px;height:30px;border-radius:10px;background:var(--ac);flex:none}
.bign{font-family:Disp;font-weight:800;font-size:92px;letter-spacing:-.05em;line-height:1;margin-top:26px}
.bars{display:flex;align-items:flex-end;gap:12px;height:300px;margin-top:34px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:10px;height:100%;font-size:15px;color:#7a7888;font-weight:600}
.bars i{display:block;width:100%;border-radius:12px;background:linear-gradient(180deg,var(--c2),var(--c1));transform-origin:50% 100%}
.li{height:98px;display:flex;align-items:center;gap:18px;border-bottom:1.500px solid #ecebf2;font-size:26px;font-weight:600;margin-top:2px}
.foot{position:absolute;left:26px;right:26px;bottom:30px;height:76px;border-radius:24px;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700;box-shadow:0 16px 30px -12px var(--ac)}
.li:first-of-type{margin-top:22px}
.ck{width:44px;height:44px;border-radius:50%;border:3px solid #d5d3df;flex:none;display:grid;place-items:center;color:#fff}
.ck svg{width:22px;height:22px}

/* 2 hero */
.ht{position:absolute;left:130px;top:0;bottom:0;width:860px;display:flex;flex-direction:column;justify-content:center}
.ht .t{font-size:124px}
.chipf{position:absolute;display:flex;align-items:center;gap:14px;font-size:27px;font-weight:700;color:var(--ink);background:#fff;padding:16px 26px 16px 18px;border-radius:99px;box-shadow:0 26px 60px -18px rgba(20,8,60,.55);white-space:nowrap}
.chipf i{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2));flex:none}

/* 3 carousel */
.cap{position:absolute;left:0;right:0;bottom:58px;text-align:center;height:90px}
.cap .t{position:absolute;left:0;right:0;font-size:70px;white-space:nowrap}

/* 4 notifications */
.nt{position:absolute;left:920px;top:150px;width:860px}
.nt .t{font-size:84px}
.nc{position:absolute;left:920px;width:800px;height:150px;border-radius:40px;background:rgba(255,255,255,.96);color:var(--ink);display:flex;align-items:center;gap:24px;padding:0 30px;box-shadow:0 40px 80px -24px rgba(20,8,60,.55)}
.nc .ic{width:86px;height:86px;border-radius:26px;background:linear-gradient(135deg,var(--c1),var(--c2));flex:none;display:grid;place-items:center}
.nc .ic svg,.nc .ic img{width:54%;height:54%;object-fit:contain}
.nc b{display:block;font-size:31px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.nc span{display:block;font-size:25px;color:#6d6b7b;margin-top:2px;white-space:nowrap}

/* 5 end */
.ec{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.icon{width:250px;height:250px;border-radius:66px;background:linear-gradient(145deg,#fff,#eeeaff);display:grid;place-items:center;box-shadow:0 60px 110px -30px rgba(20,8,60,.6),inset 0 -10px 30px rgba(120,90,255,.18)}
.icon svg,.icon img{width:56%;height:56%;object-fit:contain}
.en{font-size:190px;margin-top:26px;white-space:nowrap}
.el{font-family:Disp;font-size:66px;font-weight:700;letter-spacing:-.03em;margin-top:4px;white-space:nowrap}
.cta{display:flex;align-items:center;gap:18px;font-size:38px;font-weight:700;color:var(--ink);background:#fff;padding:18px 20px 18px 42px;border-radius:99px;margin-top:38px;box-shadow:0 30px 70px -22px rgba(20,8,60,.6)}
.cta span{font-size:27px;font-weight:600;background:var(--ink);color:#fff;padding:13px 24px;border-radius:99px}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"><div class="blob" id="b1"></div><div class="blob" id="b2"></div></div>
  <div id="shapes"></div>
  <div id="world">
    <div class="scene" id="s1"></div><div class="scene" id="s2"></div><div class="scene" id="s3"></div><div class="scene" id="s4"></div><div class="scene" id="s5"></div>
  </div>
  <div id="wipe"></div>
  <div id="fade"></div>
</div>
<script src="/engine/kit.js"></script>
<script>
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)]
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e }
const STAR = (fill) => `<svg viewBox="0 0 24 24"><path fill="${fill}" d="M12 1C12.8 7.5 16.5 11.2 23 12 16.5 12.8 12.8 16.5 12 23 11.2 16.5 7.5 12.8 1 12 7.5 11.2 11.2 7.5 12 1Z"/></svg>`
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.500 4.500L19 7.500"/></svg>'
const words = (box, text) => text.split(" ").map((w, i, a) => { const s = el("span", "w", w + (i < a.length - 1 ? " " : "")); box.append(s); return s })
let C, TL, R = {}
// Bouncy spring: overshoots and settles.
const spring = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-6.5 * x) * Math.cos(10.5 * x))

// A phone with one of three drawn screens, or a real screenshot. upd(p) plays the screen's own animation.
function phone(sc) {
  const ph = el("div", "ph"), scr = el("div", "scr"); ph.append(scr); scr.append(el("div", "notch"))
  let upd = () => {}
  if (sc.image) { const im = el("img"); im.src = K.asset(sc.image); scr.style.padding = "0"; scr.append(im) }
  else {
    scr.append(el("div", "sh", sc.heading ?? C.brand.name), el("div", "ss", sc.sub ?? ""))
    if (sc.kind === "ring") {
      const w = el("div", "ringw"), L0 = 2 * Math.PI * 105, b = el("b", null, "0%")
      w.innerHTML = `<svg viewBox="0 0 250 250"><circle cx="125" cy="125" r="105" fill="none" stroke="#eceaf3" stroke-width="24"/><circle class="rv" cx="125" cy="125" r="105" fill="none" stroke="${R.acc}" stroke-width="24" stroke-linecap="round" stroke-dasharray="${L0}" stroke-dashoffset="${L0}" transform="rotate(-90 125 125)"/></svg>`
      w.append(b); scr.append(w)
      for (const t of (sc.items ?? []).slice(0, 3)) { const r = el("div", "pillrow"); r.append(el("i"), el("span", null, t)); scr.append(r) }
      const rv = $(".rv", w); upd = (p) => { const z = K.outCubic(p); rv.setAttribute("stroke-dashoffset", L0 * (1 - (sc.value / 100) * z)); b.textContent = Math.round(sc.value * z) + "%" }
    } else if (sc.kind === "bars") {
      const n = el("div", "bign", "0"), bars = el("div", "bars"), mx = Math.max(...sc.values), days = sc.labels ?? ["M", "T", "W", "T", "F", "S", "S"]
      scr.append(n, el("div", "ss", sc.label ?? ""), bars)
      const bs = sc.values.slice(0, 7).map((v, i) => { const d = el("div"), b = el("i"); b.style.height = (v / mx) * 82 + "%"; d.append(b, document.createTextNode(days[i] ?? "")); bars.append(d); return b })
      upd = (p) => { n.textContent = K.fmt(sc.big * K.outCubic(p), sc); bs.forEach((b, i) => (b.style.transform = `scaleY(${K.outBack(K.clamp(p * 1.7 - i * 0.1), 1.4)})`)) }
    } else {
      const rows = (sc.items ?? []).slice(0, 5).map((t) => { const r = el("div", "li"), c = el("div", "ck"); c.innerHTML = CHECK; r.append(c, el("span", null, t)); scr.append(r); return { c, s: r.lastChild } })
      if (sc.button) scr.append(el("div", "foot", sc.button))
      const done = sc.done ?? rows.length - 1
      upd = (p) => rows.forEach((r, i) => { const on = i < done && p > (i + 1) / (done + 1.5), z = K.outBack(K.clamp((p - (i + 1) / (done + 1.5)) * 6), 3); r.c.style.background = on ? R.acc : "transparent"; r.c.style.borderColor = on ? R.acc : "#d5d3df"; r.c.firstChild.style.transform = `scale(${on ? z : 0})`; r.c.style.transform = `scale(${on ? 0.8 + 0.2 * z : 1})`; r.s.style.color = on ? "#9a98a8" : "" })
    }
  }
  return { ph, upd }
}

window.setup = (c, vo) => {
  C = c
  const b = K.brand(c.brand), st = $("#stage")
  if (!c.brand.color2 && c.brand.hue2 === (b.hue + 292) % 360) b.hue2 = (b.hue + 50) % 360
  st.style.setProperty("--h1", b.hue); st.style.setProperty("--h2", b.hue2); st.style.setProperty("--h3", b.hue3)
  R.acc = `oklch(.6 .23 ${b.hue})`
  R.sc = $$(".scene")
  $("#b1").style.cssText = `width:900px;height:900px;left:55%;top:-20%;background:oklch(.78 .17 ${b.hue3});opacity:.6`
  $("#b2").style.cssText = `width:800px;height:800px;left:-5%;top:55%;background:oklch(.55 .25 ${(b.hue + 330) % 360});opacity:.55`

  // Floating glossy shapes at different depths.
  const rr = K.rnd(17), cols = [`oklch(.8 .16 ${b.hue3})`, `oklch(.72 .2 ${b.hue2})`, "#ffffff", `oklch(.86 .13 ${(b.hue + 120) % 360})`]
  R.shapes = Array.from({ length: 11 }, (_, i) => {
    const e = el("div", "shape"), size = 60 + rr() * 190, kind = i % 3, col = cols[i % cols.length], depth = 0.3 + rr() * 1.2
    e.style.width = size + "px"; e.style.height = (kind === 1 ? size * 0.42 : size) + "px"; e.style.borderRadius = "999px"
    e.style.background = kind === 2 ? "none" : `radial-gradient(circle at 30% 26%,rgba(255,255,255,.95),${col} 42%,color-mix(in oklab,${col},#20104a 45%) 100%)`
    if (kind === 2) e.style.border = `${size * 0.16}px solid ${col}`
    e.style.filter = depth < 0.6 ? "blur(7px)" : depth > 1.3 ? "blur(3px)" : "none"; e.style.opacity = depth < 0.6 ? 0.6 : 0.95
    $("#shapes").append(e)
    return { e, x: rr() * 2600 - 200, y: rr() * 1000, depth, ph: rr() * 6, rot: rr() * 360 }
  })

  // 1 hook
  const s1 = $("#s1"); R.hook = el("div", "ec"); R.hookW = []
  c.hook.forEach((ln) => { const d = el("div", "t"); d.style.fontSize = "178px"; d.style.whiteSpace = "nowrap"; R.hookW.push(...words(d, ln)); R.hook.append(d) })
  s1.append(R.hook)

  // 2 hero phone with chips flying out
  const s2 = $("#s2"), ht = el("div", "ht"), tt = el("div", "t"); R.heroW = words(tt, c.hero.title); tt.style.whiteSpace = "normal"; ht.append(tt)
  R.hero = phone(c.screens[c.hero.screen ?? 2]); R.hero.ph.style.left = "1330px"; R.hero.ph.style.top = "540px"
  const CP = [[-330, -250], [250, -40], [-360, 210]]
  R.chips = c.hero.chips.slice(0, 3).map((t, i) => { const e = el("div", "chipf"); e.append(el("i"), el("span", null, t)); s2.append(e); return { e, p: CP[i] } })
  s2.append(ht, R.hero.ph); R.chips.forEach((x) => s2.append(x.e))

  // 3 carousel of the three screens
  const s3 = $("#s3"); R.car = c.screens.slice(0, 3).map((sc) => { const p = phone(sc); p.ph.style.left = "960px"; p.ph.style.top = "470px"; s3.append(p.ph); return p })
  const cap = el("div", "cap"); R.caps = c.screens.slice(0, 3).map((sc) => { const t = el("div", "t"); const w = words(t, sc.title); cap.append(t); return { t, w } }); s3.append(cap)

  // 4 notifications
  const s4 = $("#s4"); R.np = phone(c.screens[0]); R.np.ph.style.left = "500px"; R.np.ph.style.top = "560px"
  const nt = el("div", "nt"), ntt = el("div", "t"); R.ntW = words(ntt, c.notify.title); ntt.style.whiteSpace = "normal"; nt.append(ntt); R.nt = nt
  s4.append(R.np.ph, nt)
  R.ncs = c.notify.items.slice(0, 3).map((n) => { const e = el("div", "nc"), ic = el("div", "ic"), tx = el("div"); if (b.logo) { const im = el("img"); im.src = K.asset(b.logo); ic.append(im) } else ic.innerHTML = STAR("#fff"); tx.append(el("b", null, n.title), el("span", null, n.text)); e.append(ic, tx); s4.append(e); return e })

  // 5 end
  const s5 = $("#s5"), ec = el("div", "ec"); R.icon = el("div", "icon")
  if (b.logo) { const im = el("img"); im.src = K.asset(b.logo); R.icon.append(im) } else R.icon.innerHTML = STAR(R.acc)
  R.en = el("div", "t en"); R.enW = words(R.en, b.name); R.el = el("div", "el"); R.elW = words(R.el, c.end.line)
  R.cta = el("div", "cta"); R.cta.append(el("b", null, c.end.cta), el("span", null, b.url))
  ec.append(R.icon, R.en, R.el, R.cta); s5.append(ec)

  R.sc.forEach((e) => (e.style.display = "block"))
  for (const d of $$(".t", R.hook)) K.fit(d, 1700)
  R.caps.forEach((x) => K.fit(x.t.firstChild ? x.t : x.t, 1700)); K.fit(R.en, 1500); K.fit(R.el, 1600)
  const fitH = (e, maxH) => { let fs = parseFloat(getComputedStyle(e).fontSize); while (e.offsetHeight > maxH && fs > 40) { fs *= 0.94; e.style.fontSize = fs + "px" } }
  fitH(tt, 520); fitH(ntt, 190)
  const nth = nt.offsetHeight
  R.ncs.forEach((e, i) => (e.style.top = 150 + nth + 44 + i * 176 + "px"))

  // Timeline on a 116 bpm grid: 4, 6, 7, 6, 6 beats.
  const G = 60 / 116, off = [0.2, 0.5, 0.5, 0.5, 0.5]
  const { s, dur } = K.timeline(vo, [4 * G, 6 * G, 7 * G, 6 * G, 6 * G], off, [0.35, 0.35, 0.3, 0.35, 1.0], G)
  const cues = [], imp = []
  const cue = (t, k, o = {}) => cues.push({ t: +t.toFixed(3), k, ...o })
  const hit = (t, p) => imp.push({ t, p })
  const hookAt = R.hookW.map((_, k) => 0.12 + k * 0.13)
  hookAt.forEach((a, k) => { cue(a, "pop", { i: k }); cue(a, "blip", { i: k }) })
  for (let i = 1; i < 5; i++) { cue(s[i] - 0.3, "whoosh"); cue(s[i] + 0.02, "pop") }
  cue(s[1] + 0.3, "swish"); hit(s[1] + 0.6, 0.4)
  const chipAt = [1.3, 1.3 + G, 1.3 + 2 * G]; chipAt.forEach((a, k) => { cue(s[1] + a, "pop"); cue(s[1] + a + 0.05, "blip", { i: k + 2 }) })
  for (let k = 0; k < 3; k++) cue(s[1] + 0.9 + k * 0.28, "click")
  const stepAt = [2.5 * G, 4.5 * G]; stepAt.forEach((a) => { cue(s[2] + a, "swish"); cue(s[2] + a + 0.25, "blip", { i: 3 }) })
  const ncAt = [1 * G + 0.1, 2 * G + 0.1, 3 * G + 0.1]; ncAt.forEach((a, k) => { cue(s[3] + a, "ding"); cue(s[3] + a, "pop"); hit(s[3] + a + 0.08, 0.3) })
  cue(s[4] + 0.15, "impact"); cue(s[4] + 0.2, "chime"); hit(s[4] + 0.18, 0.8); cue(s[4] + 1.5, "pop")
  TL = { s, dur, off, hookAt, chipAt, stepAt, ncAt, imp, G, T: s[5] }
  window.frame(0)
  return { T: s[5], s, cues, vo: vo.map((x, i) => ({ t: +(s[i] + off[i]).toFixed(3), d: x })), marks: { beatIn: 0, beatOut: s[4] }, audio: { bpm: 116, style: "pop" }, post: { bloom: 0.12, grain: 5 } }
}

const ORG = [[960, 540], [1330, 540], [960, 470], [500, 560], [960, 420]]
const WCOL = ["#ffffff", "#14121c", "#ffffff", "#14121c"]

window.frame = (t) => {
  const { s, dur, G } = TL, P = K.p, L = K.lerp
  let zp = 0
  for (const m of TL.imp) { const a = t - m.t; if (a < 0 || a > 1.2) continue; zp += m.p * Math.exp(-a * 7) }
  let si = 0; while (si < 4 && t >= s[si + 1]) si++
  // The camera drifts sideways from scene to scene; shapes move by their depth.
  let cam = 0; for (let i = 1; i < 5; i++) cam += K.inOut(P(t, s[i] - 0.4, 0.8))
  R.shapes.forEach((o) => { const x = ((o.x - cam * 520 * o.depth + 6000) % 2600) - 300, y = o.y + Math.sin(t * 0.9 + o.ph) * 34 * o.depth; o.e.style.transform = `translate(${x}px,${y}px) rotate(${o.rot + t * 14 * o.depth}deg) scale(${1 + zp * 0.05 * o.depth})` })
  $("#b1").style.transform = `translate(${Math.sin(t * 0.5) * 160}px,${Math.cos(t * 0.4) * 110}px)`
  $("#b2").style.transform = `translate(${Math.cos(t * 0.45) * 170}px,${Math.sin(t * 0.55) * 100}px)`
  $("#world").style.transform = `scale(${1 + zp * 0.03})`

  // Circle wipe: a colour disc grows from the next scene's focus, then opens like an iris.
  const wp = $("#wipe"); let wi = 0, wx = -1
  for (let i = 1; i < 5; i++) { const x = P(t, s[i] - 0.32, 0.72); if (x > 0 && x < 1) { wi = i; wx = x } }
  if (wx < 0) wp.style.display = "none"
  else {
    const [ox, oy] = ORG[wi], grow = wx < 0.44, r = grow ? K.inCubic(wx / 0.44) * 2300 : K.outCubic((wx - 0.44) / 0.56) * 2300
    wp.style.display = "block"; wp.style.background = WCOL[wi - 1]
    wp.style.clipPath = grow ? `circle(${r}px at ${ox}px ${oy}px)` : "none"
    wp.style.webkitMaskImage = grow ? "none" : `radial-gradient(circle at ${ox}px ${oy}px,transparent ${r}px,#000 ${r + 3}px)`
  }
  R.sc.forEach((e, i) => { e.style.display = i === si ? "block" : "none" })
  const boing = (list, u, at, step) => list.forEach((e, k) => { const a = typeof at === "number" ? at + k * step : at[k], z = spring(P(u, a, 0.75)); e.style.opacity = P(u, a, 0.07); e.style.transform = `translateY(${(1 - z) * 90}px) scale(${L(0.4, 1, z)},${L(0.4, 1, z) * (1 + (1 - z) * 0.25)}) rotate(${(1 - z) * (k % 2 ? 8 : -8)}deg)` })

  // 1 hook
  let u = t - s[0]
  boing(R.hookW, u, TL.hookAt)
  R.hook.style.transform = `scale(${1 + 0.04 * (u / dur[0])})`

  // 2 hero
  u = t - s[1]
  boing(R.heroW, u, 0.3, 0.08)
  let z = spring(P(u, 0.1, 1.0)), q = K.outExpo(P(u, 0.1, 0.9))
  R.hero.ph.style.transform = `perspective(1800px) translateY(${(1 - q) * 700}px) rotateY(${L(-70, -16, q) + Math.sin(t * 1.2) * 3}deg) rotateX(${L(20, 6, q)}deg) rotate(${L(-12, 3, z)}deg) scale(${L(0.7, 1.04, z)})`
  R.hero.upd(P(u, 0.75, 1.3))
  R.chips.forEach(({ e, p }, k) => { const a = TL.chipAt[k], zz = spring(P(u, a, 0.7)); e.style.opacity = P(u, a, 0.06); e.style.left = "1330px"; e.style.top = "540px"; e.style.transform = `translate(calc(-50% + ${p[0] * zz}px),${p[1] * zz + Math.sin(t * 2 + k * 2) * 9 - 30}px) scale(${L(0.2, 1, zz)}) rotate(${(k % 2 ? 4 : -5) * zz}deg)` })

  // 3 carousel: one step per two beats
  u = t - s[2]
  const pos = K.inOut(P(u, TL.stepAt[0] - 0.3, 0.6)) + K.inOut(P(u, TL.stepAt[1] - 0.3, 0.6)), enter = K.outExpo(P(u, 0.05, 0.9))
  R.car.forEach((p, i) => {
    const d = i - pos, ad = Math.abs(d)
    p.ph.style.zIndex = String(10 - Math.round(ad * 3))
    p.ph.style.transform = `perspective(2000px) translateX(${d * 520 + (1 - enter) * 1500}px) translateY(${ad * 30}px) rotateY(${d * -24}deg) scale(${1 - Math.min(1, ad) * 0.22})`
    p.ph.style.filter = ad > 0.5 ? `brightness(${1 - Math.min(1, ad) * 0.22})` : "none"
    p.upd(K.clamp(i === 0 ? P(u, 0.4, 1.0) : P(u, TL.stepAt[i - 1] - 0.05, 1.0)))
  })
  R.caps.forEach((c, i) => { const a = i === 0 ? 0.25 : TL.stepAt[i - 1] - 0.05, out = i < 2 ? P(u, TL.stepAt[i] - 0.3, 0.25) : 0; c.t.style.opacity = 1 - out; c.w.forEach((e, k) => { const zz = spring(P(u, a + k * 0.05, 0.6)); e.style.opacity = P(u, a + k * 0.05, 0.06); e.style.transform = `translateY(${(1 - zz) * 60 - out * 40}px) scale(${L(0.6, 1, zz)})` }) })

  // 4 notifications drop on the beat
  u = t - s[3]
  q = K.outExpo(P(u, 0.05, 0.9))
  R.np.ph.style.transform = `perspective(1800px) translateX(${(1 - q) * -700}px) rotateY(${L(50, 18, q) + Math.sin(t * 1.2) * 3}deg) rotate(${L(10, -4, q)}deg)`
  R.np.upd(P(u, 0.4, 1.2))
  boing(R.ntW, u, 0.2, 0.06)
  R.ncs.forEach((e, k) => { const a = TL.ncAt[k], zz = spring(P(u, a, 0.7)); e.style.opacity = P(u, a, 0.06); e.style.transform = `translateY(${(1 - zz) * -260}px) rotate(${(1 - zz) * (k % 2 ? 5 : -5)}deg) scale(${L(0.7, 1, zz)})` })

  // 5 end
  u = t - s[4]
  z = spring(P(u, 0.12, 0.9))
  R.icon.style.transform = `scale(${z}) rotate(${(1 - z) * -40}deg)`
  boing(R.enW, u, 0.4, 0.06); boing(R.elW, u, 0.85, 0.06)
  z = spring(P(u, 1.4, 0.7)); R.cta.style.opacity = P(u, 1.4, 0.06); R.cta.style.transform = `scale(${L(0.4, 1, z)})`
  $("#fade").style.opacity = P(t, TL.T - 0.3, 0.3)
}
</script>
</body>
</html>
